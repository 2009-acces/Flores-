<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Te amo mi niña</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #fff0f5;
      font-family: cursive;
    }

    .mensaje {
      position: absolute;
      top: 40%;
      width: 100%;
      text-align: center;
      font-size: 2.5em;
      color: #e91e63;
      z-index: 1000;
    }

    .flor {
      position: absolute;
      font-size: 24px;
      animation: flotar 8s linear infinite;
      user-select: none;
    }

    @keyframes flotar {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="mensaje">Te amo mi niña</div>

  <script>
    function crearFlor() {
      const flor = document.createElement('div');
      flor.className = 'flor';
      flor.innerText = '🌸'; // puedes cambiar por 🌺 o cualquier otro emoji
      flor.style.left = Math.random() * window.innerWidth + 'px';
      flor.style.top = window.innerHeight + 'px';
      flor.style.fontSize = (20 + Math.random() * 20) + 'px';
      flor.style.animationDuration = (5 + Math.random() * 5) + 's';
      document.body.appendChild(flor);

      setTimeout(() => {
        flor.remove();
      }, 10000);
    }

    setInterval(crearFlor, 200);
  </script>

</body>
</html>
